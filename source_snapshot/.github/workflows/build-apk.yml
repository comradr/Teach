name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Prepare Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKSH-Planner-kawaii-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
