name: Sync Plania source snapshot

on:
  push:
    branches: [ main ]
    paths:
      - 'source_snapshot/**'

permissions:
  contents: write

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            source_snapshot/**/*.gradle*
            source_snapshot/gradle/wrapper/gradle-wrapper.properties
            source_snapshot/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Inject Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > source_snapshot/.env
          chmod +x source_snapshot/gradlew

      - name: Run unit tests
        working-directory: source_snapshot
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Compile adaptive Compose tests
        working-directory: source_snapshot
        run: ./gradlew --no-daemon assembleDebugAndroidTest --stacktrace

      - name: Run Android lint
        working-directory: source_snapshot
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        working-directory: source_snapshot
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Repack verified source ZIP
        run: |
          rm -f MKSH_Planner_build_ready.zip
          git archive --format=zip --output=MKSH_Planner_build_ready.zip HEAD:source_snapshot
          unzip -tq MKSH_Planner_build_ready.zip

      - name: Commit synchronized source ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MKSH_Planner_build_ready.zip
          if git diff --cached --quiet; then
            echo 'Source ZIP already matches source_snapshot.'
            exit 0
          fi
          git commit -m 'Sync verified Plania source ZIP'
          git push origin HEAD:main
