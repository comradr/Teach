name: Build Plania v1.5.4 branch

on:
  push:
    branches:
      - plania-v1.5.4-ux-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Plania v1.5.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q MKSH_Planner_build_ready.zip -d project

          cat .ci/v151/patch_*.b64 | base64 -d > /tmp/v151.patch.gz
          cat .ci/v152/patch_*.b64 | base64 -d > /tmp/v152.patch.gz
          cat .ci/v152fix/patch_*.b64 | base64 -d > /tmp/v152fix.patch.gz
          cat .ci/v153final/patch_*.b64 | base64 -d > /tmp/v153.patch.gz
          cat .ci/v153fix2/patch_*.b64 | base64 -d > /tmp/v153fix2.patch.gz
          cat .ci/v154/patch_*.b64 | base64 -d > /tmp/v154.patch.gz
          cat .ci/v154fix/patch_*.b64 | base64 -d > /tmp/v154fix.patch.gz

          for p in v151 v152 v152fix v153 v153fix2 v154 v154fix; do
            gzip -t "/tmp/$p.patch.gz"
            gzip -dc "/tmp/$p.patch.gz" > "/tmp/$p.patch"
          done

          cd project
          git init -q

          git apply --check /tmp/v151.patch
          git apply /tmp/v151.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v151

          git apply --check /tmp/v152.patch
          git apply /tmp/v152.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v152

          git apply --check /tmp/v152fix.patch
          git apply /tmp/v152fix.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v152fix

          git apply --check /tmp/v153.patch
          git apply /tmp/v153.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v153

          git apply --check /tmp/v153fix2.patch
          git apply /tmp/v153fix2.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v153final

          git apply --check /tmp/v154.patch
          git apply /tmp/v154.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v154

          git apply --check /tmp/v154fix.patch
          git apply /tmp/v154fix.patch
          git diff --check
          chmod +x gradlew

          grep -n "versionCode\|versionName" app/build.gradle.kts
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "1.5.4"' app/build.gradle.kts

      - name: Unit tests
        working-directory: project
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: project
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: project
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.4-apks
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.4-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
