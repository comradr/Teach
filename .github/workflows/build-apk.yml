name: Build MKSH APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Unpack current project
        run: |
          mkdir -p project
          unzip -tq MKSH_Planner_build_ready.zip
          unzip -q MKSH_Planner_build_ready.zip -d project
          chmod +x project/gradlew

      - name: Inject Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > project/.env

      - name: Run unit tests
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run Android lint
        working-directory: project
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp project/app/build/outputs/apk/debug/app-debug.apk artifacts/MKSH-Planner-kawaii-debug.apk
          sha256sum artifacts/MKSH-Planner-kawaii-debug.apk > artifacts/SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKSH-Planner-kawaii-debug
          path: artifacts/*

      - name: Publish current build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-current --yes --cleanup-tag || true
          git tag -f build-current
          git push -f origin build-current
          gh release create build-current artifacts/MKSH-Planner-kawaii-debug.apk artifacts/SHA256.txt --title "MKSH Planner kawaii debug" --notes "Unit tests, lint and assembleDebug completed successfully."
