name: Build Plania APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack current project
        run: |
          rm -rf project
          mkdir -p project
          unzip -tq MKSH_Planner_build_ready.zip
          unzip -q MKSH_Planner_build_ready.zip -d project
          chmod +x project/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            project/**/*.gradle*
            project/gradle/wrapper/gradle-wrapper.properties
            project/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Prepare Gemini key
        working-directory: project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            GEMINI_API_KEY=MY_GEMINI_API_KEY
          fi
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

      - name: Run unit tests
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Compile adaptive Compose tests
        working-directory: project
        run: ./gradlew --no-daemon assembleDebugAndroidTest --stacktrace

      - name: Run Android lint
        working-directory: project
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build unsigned release APK
        working-directory: project
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Collect APK and signing tool
        run: |
          mkdir -p artifacts
          cp project/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Plania-v1.5.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          sha256sum artifacts/Plania-v1.5.0-unsigned.apk > artifacts/SHA256-unsigned.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.0-unsigned
          path: artifacts/*
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.0-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
