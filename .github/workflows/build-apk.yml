# Technical branch change to trigger PR build
name: Build MKSH APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36.1 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project
          chmod +x project/gradlew

      - name: Build debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp project/app/build/outputs/apk/debug/app-debug.apk artifacts/MKSH-Planner-v3-debug.apk
          sha256sum artifacts/MKSH-Planner-v3-debug.apk > artifacts/SHA256.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKSH-Planner-v3-debug
          path: artifacts/*

      - name: Publish release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-v3 --yes --cleanup-tag || true
          git tag -f build-v3
          git push -f origin build-v3
          gh release create build-v3 \
            artifacts/MKSH-Planner-v3-debug.apk \
            artifacts/SHA256.txt \
            --title "MKSH Planner v3 debug" \
            --notes "Automated debug APK build."
