name: Build MKSH APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36.1 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Unpack current project
        run: |
          rm -rf project
          mkdir project
          unzip -tq MKSH_Planner_build_ready.zip
          unzip -q MKSH_Planner_build_ready.zip -d project
          if [ ! -f project/gradlew ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 3 -type f -name gradlew -printf '%h\n' | head -n1)"
            if [ -z "$ROOT" ]; then
              echo "gradlew not found in archive"
              exit 1
            fi
            shopt -s dotglob
            mv "$ROOT"/* project/
          fi
          chmod +x project/gradlew
          echo "Project files before patch: $(find project -type f | wc -l)"

      - name: Apply current fixes
        run: |
          base64 -d mksh-overlay.patch.gz.b64 | gzip -dc > /tmp/mksh-overlay.patch
          cd project
          git init -q
          git apply --check /tmp/mksh-overlay.patch
          git apply /tmp/mksh-overlay.patch
          echo "Overlay applied successfully."
          test -f app/src/main/java/com/example/GeminiApiKeyProvider.kt
          test -f app/src/main/java/com/example/GeminiErrorMapper.kt
          grep -q 'x-goog-api-key' app/src/main/java/com/example/GeminiApiService.kt

      - name: Inject Gemini key when configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > project/.env
            echo "Gemini key injected from GitHub Actions secret."
          else
            echo "GEMINI_API_KEY secret is not configured. APK can accept the key from the in-app Gemini settings."
          fi

      - name: Run unit tests
        working-directory: project
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp project/app/build/outputs/apk/debug/app-debug.apk artifacts/MKSH-Planner-fixed-debug.apk
          sha256sum artifacts/MKSH-Planner-fixed-debug.apk > artifacts/SHA256.txt
          ls -lh artifacts/MKSH-Planner-fixed-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKSH-Planner-fixed-debug
          path: artifacts/*

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-current --yes --cleanup-tag || true
          git tag -f build-current
          git push -f origin build-current
          gh release create build-current \
            artifacts/MKSH-Planner-fixed-debug.apk \
            artifacts/SHA256.txt \
            --title "MKSH Planner fixed debug" \
            --notes "Automated test + build with Gemini error handling and in-app API key settings fixes."
