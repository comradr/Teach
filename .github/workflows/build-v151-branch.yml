name: Build Plania v1.5.1 branch

on:
  push:
    branches:
      - plania-v1.5.1-audit-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct patched project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q MKSH_Planner_build_ready.zip -d project
          cat .ci/v151/patch_*.b64 | base64 -d | gzip -d > /tmp/v151.patch
          cd project
          git init -q
          git apply --check /tmp/v151.patch
          git apply /tmp/v151.patch
          chmod +x gradlew
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Unit tests
        working-directory: project
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: project
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: project
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.1-apks
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.1-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
