name: Build Plania 2.0.1 polish

on:
  push:
    branches:
      - plania-v2.0.1-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Plania 2.0.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q MKSH_Planner_build_ready.zip -d project

          cat .ci/v151/patch_*.b64 | base64 -d > /tmp/v151.patch.gz
          cat .ci/v152/patch_*.b64 | base64 -d > /tmp/v152.patch.gz
          cat .ci/v152fix/patch_*.b64 | base64 -d > /tmp/v152fix.patch.gz
          cat .ci/v153final/patch_*.b64 | base64 -d > /tmp/v153.patch.gz
          cat .ci/v153fix2/patch_*.b64 | base64 -d > /tmp/v153fix2.patch.gz
          cat .ci/v154/patch_*.b64 | base64 -d > /tmp/v154.patch.gz
          cat .ci/v154fix/patch_*.b64 | base64 -d > /tmp/v154fix.patch.gz
          cat .ci/v155/part_*.bin > /tmp/v155.patch.gz
          cat .ci/v155fix2/part_*.bin > /tmp/v155fix2.patch.gz
          cp .ci/v200.patch /tmp/v200.patch
          cp .ci/v201.patch /tmp/v201.patch
          cp .ci/v201fix.patch /tmp/v201fix.patch

          for p in v151 v152 v152fix v153 v153fix2 v154 v154fix v155 v155fix2; do
            gzip -t "/tmp/$p.patch.gz"
            gzip -dc "/tmp/$p.patch.gz" > "/tmp/$p.patch"
          done

          echo "463737fff74945f4917eb696ecfc72a22f35fd66c5c0319c1e1d033bef51d49c  /tmp/v155.patch.gz" | sha256sum -c -
          echo "5787795081b18d0809e5934ed0f761ee65ee9dc7a073a1ecfba4d438be409af1  .ci/v155fix.patch" | sha256sum -c -
          echo "1f818f4c2a1578516c560d2db45af9a43a4889140880e92b554e25e3ee52569c  /tmp/v155fix2.patch.gz" | sha256sum -c -
          echo "9f919e95b6cfb1386ee78f676c698a51b36c1c8d864a334341b923fb27b972f4  /tmp/v200.patch" | sha256sum -c -
          echo "d3014feebcac96c1e1a239d68a4ff66346000433b0ad8cf2b26b174dad65dc11  /tmp/v201.patch" | sha256sum -c -
          echo "d348850cd180f63745741e19217a2f7fd0be642eb20fa18e991b0136ce8251f2  /tmp/v201fix.patch" | sha256sum -c -

          cd project
          git init -q

          for p in v151 v152 v152fix v153 v153fix2 v154 v154fix; do
            git apply --check "/tmp/$p.patch"
            git apply "/tmp/$p.patch"
            git add -A
            git -c user.name=ci -c user.email=ci@local commit -qm "$p"
          done

          git apply --check /tmp/v155.patch
          git apply /tmp/v155.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v155

          git apply --check ../.ci/v155fix.patch
          git apply ../.ci/v155fix.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v155fix

          git apply --check /tmp/v155fix2.patch
          git apply /tmp/v155fix2.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v155polish

          git apply --check /tmp/v200.patch
          git apply /tmp/v200.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v200

          git apply --check /tmp/v201.patch
          git apply /tmp/v201.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v201

          git apply --check /tmp/v201fix.patch
          git apply /tmp/v201fix.patch
          git diff --check
          chmod +x gradlew

          grep -n "versionCode\|versionName" app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "2.0.1"' app/build.gradle.kts

      - name: Unit tests
        working-directory: project
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: project
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: project
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v2.0.1-apks
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v2.0.1-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
