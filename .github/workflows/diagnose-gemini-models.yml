name: Diagnose Gemini Models

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check fallback models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          models = ["gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-2.5-flash-lite"]
          payload = json.dumps({"contents":[{"parts":[{"text":"Ответь одним словом: готово"}]}]}).encode()

          for model in models:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              request = urllib.request.Request(url, data=payload, headers={
                  "Content-Type":"application/json",
                  "x-goog-api-key":key
              }, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      response.read()
                      print(json.dumps({"model":model, "http":response.status, "ok":True}))
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw).get("error", {})
                  except Exception:
                      body = {}
                  print(json.dumps({
                      "model":model,
                      "http":error.code,
                      "status":body.get("status"),
                      "message":str(body.get("message",""))[:160]
                  }))
              except Exception as error:
                  print(json.dumps({"model":model, "transport":type(error).__name__}))
          PY
