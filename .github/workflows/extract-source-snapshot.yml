name: Extract Plania source snapshot

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/extract-source-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current source ZIP
        run: |
          rm -rf source_snapshot
          mkdir -p source_snapshot
          unzip -tq MKSH_Planner_build_ready.zip
          unzip -q MKSH_Planner_build_ready.zip -d source_snapshot

      - name: Commit source snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source_snapshot
          if git diff --cached --quiet; then
            echo 'Source snapshot is already current.'
            exit 0
          fi
          git commit -m 'Expose current Plania source snapshot for maintenance'
          git push origin HEAD:main
