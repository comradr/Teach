name: Build Plania v1.5.3 branch

on:
  push:
    branches:
      - plania-v1.5.3-audit-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Plania v1.5.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q MKSH_Planner_build_ready.zip -d project

          cat .ci/v151/patch_*.b64 | base64 -d > /tmp/v151.patch.gz
          cat .ci/v152/patch_*.b64 | base64 -d > /tmp/v152.patch.gz
          cat .ci/v152fix/patch_*.b64 | base64 -d > /tmp/v152fix.patch.gz
          cat .ci/v153final/patch_*.b64 | base64 -d > /tmp/v153.patch.gz

          gzip -t /tmp/v151.patch.gz
          gzip -t /tmp/v152.patch.gz
          gzip -t /tmp/v152fix.patch.gz
          gzip -t /tmp/v153.patch.gz

          gzip -dc /tmp/v151.patch.gz > /tmp/v151.patch
          gzip -dc /tmp/v152.patch.gz > /tmp/v152.patch
          gzip -dc /tmp/v152fix.patch.gz > /tmp/v152fix.patch
          gzip -dc /tmp/v153.patch.gz > /tmp/v153.patch

          cd project
          git init -q

          git apply --check /tmp/v151.patch
          git apply /tmp/v151.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v151

          git apply --check /tmp/v152.patch
          git apply /tmp/v152.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v152

          git apply --check /tmp/v152fix.patch
          git apply /tmp/v152fix.patch
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm v152fix

          git apply --check /tmp/v153.patch
          git apply /tmp/v153.patch
          git diff --check
          chmod +x gradlew

          grep -n "versionCode\|versionName" app/build.gradle.kts
          grep -q 'versionCode = 19' app/build.gradle.kts
          grep -q 'versionName = "1.5.3"' app/build.gradle.kts

      - name: Unit tests
        working-directory: project
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: project
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: project
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        working-directory: project
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.3-apks
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Plania-v1.5.3-reports
          path: |
            project/app/build/reports/tests/
            project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
